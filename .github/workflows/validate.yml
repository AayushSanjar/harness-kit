name: validate

on:
  push:
  pull_request:
  # By hand, to run the fault replays on a branch: gh workflow run validate.yml --ref <branch>
  workflow_dispatch:
  # The weekly full fault replay, Mondays at 03:00 UTC (the person's slot,
  # .reports/inc-speed-b.brief.md). docs.github.com/en/actions/reference/workflows-and-actions/
  # events-that-trigger-workflows (read 2026-09-29): "Scheduled workflows run on the latest
  # commit on the default branch."; "The `schedule` event can be delayed during periods of
  # high loads of GitHub Actions workflow runs"; "In a public repository, scheduled
  # workflows are automatically disabled when no repository activity has occurred in 60
  # days." The start-up picture shows the age of the last full CI replay, so a run that
  # stopped coming shows there.
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  # The fault replay's session limit (replay-faults.sh's THE TIME LIMITS), 25 minutes: below
  # the replay jobs' 30-minute timeout, so that the harness stops a hung replay and reports
  # TIMEOUT itself, with 5 minutes left for the job's setup and its upload, before GitHub
  # would cancel the job. The person's decision (.reports/inc-replay-speed.brief.md). The
  # validate job never runs a real replay, and tests/replay-faults.test.sh unsets it.
  HARNESS_KIT_REPLAY_SESSION_SECONDS: 1500

jobs:
  validate:
    # Pinned, not ubuntu-latest (which moves), to 24.04: the image ubuntu-latest points at
    # today, so the runner every green run so far has used. Moving to 26.04 is a separate
    # change. The standard runners table for public repositories at
    # docs.github.com/en/actions/reference/runners/github-hosted-runners (read 2026-09-27):
    #   "ubuntu-latest, ubuntu-24.04, ubuntu-22.04, ubuntu-26.04"
    runs-on: ubuntu-24.04
    outputs:
      machinery: ${{ steps.plan.outputs.machinery }}
    steps:
      # The full history: tests/validate.sh runs check-defects.mjs on .harness/defects.tsv,
      # which needs the base branch (origin/main) and its merge-base with HEAD.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Whether this push changes the replay machinery (.harness/replay-machinery), from the
      # Replay line of replay-faults.sh --plan; the replay jobs below run for a branch push
      # that does. A plan that cannot be made counts as a change, so the replay runs.
      - name: Plan the fault replay
        id: plan
        run: |
          if line="$(bash plugins/harness-kit/scripts/replay-faults.sh --plan)"; then
            echo "$line"
          else
            line="machinery changed: unknown (replay-faults.sh --plan failed, above)"
            echo "$line"
          fi
          case "$line" in
            *"machinery changed:"*) echo "machinery=true" >>"$GITHUB_OUTPUT" ;;
            *) echo "machinery=false" >>"$GITHUB_OUTPUT" ;;
          esac

      # Native installer, the method recommended in code.claude.com/docs/en/setup.
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show Claude Code version
        run: claude --version

      - name: Run tests/validate.sh
        run: bash tests/validate.sh

  # Fault replays: each entry of .harness/mutations.tsv puts back a break an earlier
  # increment proved, and the validate.sh case named for it must FAIL (replay-faults.sh).
  # Each entry runs the whole of tests/validate.sh, plus one run without a fault (the
  # baseline), so it is kept out of consumer projects' CI (their repositories may be
  # private, and pay for minutes). This repository is public, and docs.github.com/en/billing/concepts/
  # product-billing/github-actions (read 2026-09-27) says: "GitHub Actions usage is free
  # for self-hosted runners and for public repositories that use standard GitHub-hosted
  # runners." ubuntu-24.04 is a standard runner (the table quoted above); larger runners
  # "are always charged for, even when used by public repositories", so none is used.
  #
  # The replay is one session in parts: replay-baseline runs the baseline once; then
  # replay-shard runs the entries in 8 shards side by side (each shard's runs in parallel, up
  # to the runner's CPUs), each taking its run limit from that baseline's measured seconds
  # (--baseline-from); and replay-verdicts judges every part's results against that one
  # baseline, printing what a whole run prints. A missing part's entries are ERRORs, and
  # parts from another commit are refused. The 8 shards are the person's choice
  # (.reports/inc-replay-speed.brief.md), and so are the jobs' 30-minute timeouts: above the
  # harness's own limits (the baseline's, 20 minutes on a fresh runner with none recorded;
  # the session's, 25 minutes, set above), so that a hang is reported as TIMEOUT by the
  # harness, not cancelled by GitHub.
  #
  # They run for pushes to main, weekly (the schedule above), by hand (workflow_dispatch;
  # the start-up picture's command when the last one is 7 days old), and for a branch push
  # whose plan (the validate job's plan step) says it changes the replay machinery: the
  # files on .harness/replay-machinery, a fault in which could change verdicts a targeted
  # replay does not run. Any other branch push, and a pull request, runs validate alone.
  # release.sh (this repository's) and ship.sh (a consumer's) wait for the branch's runs, so
  # a machinery change merges only after its full replay passes; a fault any other merged
  # change let SURVIVE shows up here, after the merge, as a red run on main. With
  # .harness/check-only, each entry runs only its own test file (validate.sh --only), and
  # the baseline part runs the whole check.
  replay-baseline:
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || needs.validate.outputs.machinery == 'true')) || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # above the harness's limits (THE TIME LIMITS in replay-faults.sh)
    steps:
      # The full history: the baseline runs tests/validate.sh, and so check-defects.mjs, in a
      # worktree of this repository.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The results go outside the checkout, so they never change the working tree replayed.
      - name: Run the baseline part
        run: bash plugins/harness-kit/scripts/replay-faults.sh --part baseline --out "$RUNNER_TEMP/replay"

      - uses: actions/upload-artifact@v4
        with:
          name: replay-baseline
          path: ${{ runner.temp }}/replay
          if-no-files-found: error

  replay-shard:
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || needs.validate.outputs.machinery == 'true')) || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [validate, replay-baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Every shard runs to the end, so one red shard does not hide another's results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The baseline part's results: its measured seconds set this shard's run limit.
      - uses: actions/download-artifact@v4
        with:
          name: replay-baseline
          path: ${{ runner.temp }}/baseline

      - name: Run shard ${{ matrix.shard }} of 8
        run: bash plugins/harness-kit/scripts/replay-faults.sh --part ${{ matrix.shard }}/8 --out "$RUNNER_TEMP/replay" --baseline-from "$RUNNER_TEMP/baseline"

      - uses: actions/upload-artifact@v4
        with:
          name: replay-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/replay
          if-no-files-found: error

  replay-verdicts:
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || needs.validate.outputs.machinery == 'true')) || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [validate, replay-baseline, replay-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The same commit, to check the parts were run on it and to read .harness/mutations.tsv.
      # Judging runs no check, so Claude Code is not installed.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: replay-*
          path: ${{ runner.temp }}/replay
          merge-multiple: true

      - name: Judge the parts
        run: bash plugins/harness-kit/scripts/replay-faults.sh --judge "$RUNNER_TEMP/replay"
