name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # Pinned, not ubuntu-latest (which moves), to 24.04: the image ubuntu-latest points at
    # today, so the runner every green run so far has used. Moving to 26.04 is a separate
    # change. The standard runners table for public repositories at
    # docs.github.com/en/actions/reference/runners/github-hosted-runners (read 2026-09-27):
    #   "ubuntu-latest, ubuntu-24.04, ubuntu-22.04, ubuntu-26.04"
    runs-on: ubuntu-24.04
    steps:
      # The full history: tests/validate.sh runs check-defects.mjs on .harness/defects.tsv,
      # which needs the base branch (origin/main) and its merge-base with HEAD.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Native installer, the method recommended in code.claude.com/docs/en/setup.
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show Claude Code version
        run: claude --version

      - name: Run tests/validate.sh
        run: bash tests/validate.sh

  # Fault replays: each entry of .harness/mutations.tsv puts back a break an earlier
  # increment proved, and the validate.sh case named for it must FAIL (replay-faults.sh).
  # It runs the whole of tests/validate.sh once per entry, plus once without a fault, so it
  # is kept out of consumer projects' CI (their repositories may be private, and pay for
  # minutes). This repository is public, and docs.github.com/en/billing/concepts/
  # product-billing/github-actions (read 2026-09-27) says: "GitHub Actions usage is free
  # for self-hosted runners and for public repositories that use standard GitHub-hosted
  # runners." ubuntu-24.04 is a standard runner (the table quoted above); larger runners
  # "are always charged for, even when used by public repositories", so none is used.
  #
  # It runs only for pushes to main: a branch push or a pull request runs validate alone.
  # release.sh (this repository's) and ship.sh (a consumer's) wait for the branch's runs, so
  # a fault a merged change let SURVIVE shows up here, after the merge, as a red run on main.
  replay-faults:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # The full history: replay-faults.sh runs tests/validate.sh, and so check-defects.mjs,
      # in worktrees of this repository, for its baseline and for every fault.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run replay-faults.sh
        run: bash plugins/harness-kit/scripts/replay-faults.sh
